<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dear Myself</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Patrick+Hand+SC&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-[#FFEEDD] min-h-screen flex items-center justify-center p-4 sm:p-6"
  >
    <div
      class="relative bg-[#FFD8BE] w-full max-w-[550px] min-h-[550px] sm:h-[550px] border-[4px] border-[#9381FF] flex flex-col items-center justify-start pt-6 px-4 sm:px-6 pb-24 rounded-3xl"
    >
      <h1
        class="font-['Patrick_Hand_SC'] text-4xl sm:text-5xl text-[#9381FF] font-semibold text-center sm:text-start"
      >
        Tell me about your day?
      </h1>

      <div
        class="w-full max-w-[450px] flex flex-col items-stretch mt-6 sm:mt-8"
      >
        <textarea
          id="reflectionInput"
          class="w-full h-[260px] sm:h-[280px] p-4 border-2 border-[#9381FF] rounded-2xl bg-[#FFEEDD] text-[#9381FF] font-['Patrick_Hand_SC'] text-lg sm:text-xl resize-none focus:outline-none focus:ring-2 focus:ring-[#9381FF]"
          placeholder="Write your thoughts here..."
        ></textarea>
        <p
          id="wordCount"
          class="mt-2 text-right font-['Patrick_Hand_SC'] text-base sm:text-lg text-[#9381FF]"
        >
          0 / 500 words
        </p>
      </div>

      <button
        type="button"
        onclick="window.location.href = 'mood.html'"
        class="absolute bottom-5 left-5 sm:left-6 px-5 sm:px-6 py-2 sm:py-2.5 rounded-xl border-2 border-[#9381FF] bg-[#FFEEDD] text-[#9381FF] font-['Patrick_Hand_SC'] text-lg sm:text-xl shadow-[0_4px_0_0_#B8B8FF] hover:-translate-y-0.5 hover:shadow-[0_6px_0_0_#B8B8FF] transition duration-200 cursor-pointer"
      >
        Back
      </button>

      <button
        id="nextBtn"
        type="button"
        disabled
        class="absolute bottom-5 right-5 sm:right-6 px-5 sm:px-6 py-2 sm:py-2.5 rounded-xl border-2 border-[#9381FF] bg-[#9381FF] text-[#FFEEDD] font-['Patrick_Hand_SC'] text-lg sm:text-xl shadow-[0_4px_0_0_#7B68EE] transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none enabled:cursor-pointer enabled:hover:-translate-y-0.5 enabled:hover:shadow-[0_6px_0_0_#7B68EE]"
      >
        Next
      </button>
    </div>

    <script src="day.js"></script>
  </body>
</html>
